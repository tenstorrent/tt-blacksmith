name: On push

# CI is paused during the tt-crank migration: the tt-xla test suites no longer
# match the tree. Manual runs only; the push trigger returns with the
# experiments PR of the migration stack.
on:
  workflow_dispatch:
  # push:
  #   branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write
  deployments: write

jobs:
  test:
    uses: ./.github/workflows/call-test.yml
    secrets: inherit
    with:
      docker_image: "ghcr.io/tenstorrent/tt-xla/tt-xla-base-ubuntu-24-04:latest"
      use-shared-runners: true
      test_suite: basic-test.json

  deploy-docs:
    uses: ./.github/workflows/call-build-docs.yml
    secrets: inherit
