name: Docs - Build & Deploy

on:
  workflow_call:

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on:
      - ubuntu-latest
    environment: github-pages
    env:
      SEARCH_API_BASE: https://csl860x2oj.execute-api.us-east-2.amazonaws.com/prod
      DOC_CATALOG_SOURCE_ID: docs-tenstorrent
      DOC_SITE_BASE_URL: https://docs.tenstorrent.com/tt-blacksmith
      DOCS_ID_NAMESPACE: tt-blacksmith
      DOCS_INDEX_VERSION: latest
      DOCS_OUTPUT_DIR: docs/output
      DOCS_SEARCH_INGEST_API_KEY: ${{ secrets.DOCS_SEARCH_INGEST_API_KEY_DOCS_TENSTORRENT }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build Docs
      run: |
        cd docs
        make build
        cd ..

    - name: Warn if search ingest key is missing
      if: ${{ env.DOCS_SEARCH_INGEST_API_KEY == '' }}
      run: echo "::warning::Skipping OpenSearch indexing: DOCS_SEARCH_INGEST_API_KEY_DOCS_TENSTORRENT secret not set."

    - name: Index docs into OpenSearch
      if: ${{ env.DOCS_SEARCH_INGEST_API_KEY != '' }}
      continue-on-error: true
      run: python scripts/index_remote_search.py

    - name: Upload artifact
      uses: actions/upload-pages-artifact@57f0e8492b437b7818227931fef2faa1a379839b # v4 + upload-artifact@v7 update
      with:
        path: ./docs/output

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
