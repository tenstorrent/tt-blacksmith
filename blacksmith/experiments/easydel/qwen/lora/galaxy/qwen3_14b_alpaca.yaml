# Dataset settings
dataset_id: "alpaca"

# Model settings
model_name: "Qwen/Qwen3-14B-Base"
max_length: 256
mask_max_position_embeddings: 256
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-4
warmup_steps: 0
end_learning_rate: 0.0
batch_size: 4
gradient_accumulation_steps: 1
num_epochs: 1
val_steps_freq: 25
max_val_batches: 10

# LoRA settings
lora_rank: 32
lora_pattern: ".*(q_proj|v_proj).*"

# Reproducibility settings
seed: 42
deterministic: true

# Logging settings
use_wandb: true
wandb_project: "Qwen-TT-EasyDel-LoRA-Training"
wandb_run_name: "qwen3-32b-sst2-tt-quietbox-easydel"
print_examples: false
steps_freq: 10
log_level: "INFO"

# Checkpoint settings
resume_from_checkpoint: false
resume_option: "last"
checkpoint_path: ""
checkpoint_metric: "val/loss"
checkpoint_metric_mode: "min"
keep_last_n: 2
keep_best_n: 1
save_strategy: "none"
epoch_freq: 1
project_dir: "blacksmith/experiments/easydel/qwen/lora"
save_optim: false
storage_backend: "local"
sync_to_storage: false
load_from_storage: false
remote_path: ""

# Device settings
use_tt: true
num_devices: 32
mesh_shape: [4, 8]
mesh_axis_names: ["data", "model"]
input_sharding_dim: "data"
apply_gqa_workaround: true

# Tensor-parallel sharding patterns.
# nn.LoRA wrapping moves the original q_proj/v_proj kernel from
# self_attn.<proj>.kernel.value to self_attn.<proj>.base_module.kernel.value
# and adds lora_a [in, rank] and lora_b [rank, out] siblings. The (?:\.base_module)?
# group keeps the rule working whether or not LoRA is applied.
model_sharding_patterns:
  # Attention kernels (Megatron-style):
  - ['self_attn\.q_proj(?:\.base_module)?\.kernel\.value$', [null, "model"]]
  - ['self_attn\.k_proj\.kernel\.value$',                   [null, "model"]]
  - ['self_attn\.v_proj(?:\.base_module)?\.kernel\.value$', [null, "model"]]
  - ['self_attn\.o_proj\.kernel\.value$',                   ["model", null]]
  # LoRA adapters on q_proj / v_proj: A replicates (matches replicated input dim),
  # B is column-parallel on its output dim (matches the base column-parallel output).
  - ['self_attn\.(q_proj|v_proj)\.lora_a\.value$',          [null, null]]
  - ['self_attn\.(q_proj|v_proj)\.lora_b\.value$',          [null, null]]
  # MLP: column-parallel gate/up, row-parallel down.
  - ['mlp\.gate_proj\.kernel\.value$',                      [null, "model"]]
  - ['mlp\.up_proj\.kernel\.value$',                        [null, "model"]]
  - ['mlp\.down_proj\.kernel\.value$',                      ["model", null]]
  # lm_head column-parallel.
  - ['lm_head\.kernel\.value$',                             [null, "model"]]

# Framework
framework: "easydel"