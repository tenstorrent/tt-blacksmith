# Dataset settings
dataset_id: "alpaca"

# Model settings
model_name: "Qwen/Qwen3-4B"
max_length: 64
mask_max_position_embeddings: 64
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-4
warmup_steps: 0
end_learning_rate: 0.0
batch_size: 2
gradient_accumulation_steps: 4
num_epochs: 1
val_steps_freq: 25
max_val_batches: 10

# LoRA settings
lora_rank: 32
lora_pattern: ".*(q_proj|v_proj).*"

# Reproducibility settings
seed: 42
deterministic: true

# Logging settings
use_wandb: true
wandb_project: "Qwen-TT-EasyDel-LoRA-Training"
wandb_run_name: "qwen3-4b-alpaca-tt-quietbox-easydel"
print_examples: true
steps_freq: 10
log_level: "INFO"

# Checkpoint settings
resume_from_checkpoint: false
resume_option: "last"
checkpoint_path: ""
checkpoint_metric: "val/loss"
checkpoint_metric_mode: "min"
keep_last_n: 2
keep_best_n: 1
save_strategy: "none"
epoch_freq: 1
project_dir: "blacksmith/experiments/easydel/qwen/lora"
save_optim: false
storage_backend: "local"
sync_to_storage: false
load_from_storage: false
remote_path: ""

# Device settings
use_tt: true
num_devices: 8
mesh_shape: [8]
mesh_axis_names: ["model"]
input_sharding_dim: null
apply_gqa_workaround: true
use_shardy_partitioner: true

# Tensor-parallel sharding patterns.
model_sharding_patterns:
  # Attention kernels (Megatron-style):
  - ['self_attn\.q_proj\.kernel\.value$', [null, "model"]]
  - ['self_attn\.k_proj\.kernel\.value$', [null, "model"]]
  - ['self_attn\.v_proj\.kernel\.value$', [null, "model"]]
  - ['self_attn\.o_proj\.kernel\.value$', ["model", null]]
  # MLP: column-parallel gate/up, row-parallel down.
  - ['mlp\.gate_proj\.kernel\.value$',    [null, "model"]]
  - ['mlp\.up_proj\.kernel\.value$',      [null, "model"]]
  - ['mlp\.down_proj\.kernel\.value$',    ["model", null]]
  # lm_head column-parallel.
  - ['lm_head\.kernel\.value$',           [null, "model"]]

# Framework
framework: "easydel"
