# Dataset settings
dataset_id: "wikitext"
dataset_configuration: "wikitext-2-raw-v1"

# Model settings
model_name: "Qwen/Qwen3-0.6B"
max_length: 256
mask_max_position_embeddings: 256
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-5
batch_size: 4
gradient_accumulation_steps: 8
num_epochs: 1
val_steps_freq: 50
max_val_batches: 20

# LoRA settings
lora_rank: 16
lora_pattern: ".*(q_proj|v_proj).*"

# Other settings
use_wandb: true
print_examples: false
use_tt: true
