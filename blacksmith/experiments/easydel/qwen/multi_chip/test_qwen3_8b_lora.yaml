# Dataset settings
dataset_id: "wikitext"
dataset_configuration: "wikitext-2-raw-v1"

# Model settings
model_name: "Qwen/Qwen3-8B"
max_length: 128
dtype: "jnp.bfloat16"

# Training hyperparameters
learning_rate: 1e-4
batch_size: 2
gradient_accumulation_steps: 4
num_epochs: 1
val_steps_freq: 50
max_val_batches: 10

# LoRA settings
lora_rank: 8
lora_pattern: ".*(q_proj|v_proj).*"

# Other settings
model_to_wandb: true
wandb_project: "Qwen-TT-EasyDel-LoRA-Training"
wandb_run_name: "qwen3-8b-wikitext-tt-easydel-n300"
use_tt: true
num_devices: 2
