# Dataset settings
dataset_id: "wikitext"
dataset_configuration: "wikitext-2-raw-v1"

# Model settings
model_name: "Qwen/Qwen3-4B"
max_length: 128
mask_max_position_embeddings: 128
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-4
warmup_steps: 50
end_learning_rate: 0.0
batch_size: 4
gradient_accumulation_steps: 1
num_epochs: 1
val_steps_freq: 25
max_val_batches: 10

# LoRA settings
lora_rank: 16
lora_pattern: ".*(q_proj|v_proj).*"

# Other settings
use_wandb: true
wandb_project: "Qwen-TT-EasyDel-LoRA-Training"
wandb_run_name: "qwen3-4b-wikitext-tt-easydel-n300"
print_examples: true
use_tt: true
num_devices: 2
