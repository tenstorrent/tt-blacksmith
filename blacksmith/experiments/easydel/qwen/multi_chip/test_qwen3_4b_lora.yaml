# Dataset settings
dataset_id: "sst2"

# Model settings
model_name: "Qwen/Qwen3-4B"
max_length: 128
mask_max_position_embeddings: 128
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-4
warmup_steps: 0
end_learning_rate: 0.0
batch_size: 2
gradient_accumulation_steps: 4
num_epochs: 1
val_steps_freq: 25
max_val_batches: 10

# LoRA settings
lora_rank: 8
lora_pattern: ".*(q_proj|v_proj).*"

# Other settings
use_wandb: true
wandb_project: "Qwen-TT-EasyDel-LoRA-Training"
wandb_run_name: "qwen3-4b-sst2-tt-multichip-easydel"
print_examples: true
use_tt: true
num_devices: 2
