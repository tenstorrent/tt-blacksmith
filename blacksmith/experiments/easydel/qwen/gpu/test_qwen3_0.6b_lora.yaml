# Dataset settings
dataset_id: "wikitext"
dataset_configuration: "wikitext-2-raw-v1"

# Model settings
model_name: "Qwen/Qwen3-0.6B"
max_length: 128
mask_max_position_embeddings: 128
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-5
warmup_steps: 20
end_learning_rate: 0.0
batch_size: 4
gradient_accumulation_steps: 8
num_epochs: 2
val_steps_freq: 50
max_val_batches: 20

# LoRA settings
lora_rank: 32
lora_pattern: ".*(q_proj|v_proj).*"

# Other settings
use_wandb: true
print_examples: true
use_tt: false
