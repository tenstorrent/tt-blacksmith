# Dataset settings
dataset_id: "wikitext"
dataset_configuration: "wikitext-2-raw-v1"

# Model settings
model_name: "Qwen/Qwen3-0.6B"
max_length: 128
dtype: "jnp.bfloat16"

# Training hyperparameters
learning_rate: 2e-4
batch_size: 4
gradient_accumulation_steps: 1
num_epochs: 1
val_steps_freq: null

# LoRA settings
lora_rank: 16
lora_pattern: ".*(q_proj|v_proj).*"

# Other settings
model_to_wandb: true
use_tt: true
