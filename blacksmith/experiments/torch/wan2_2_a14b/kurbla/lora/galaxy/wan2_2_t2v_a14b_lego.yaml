# Entry mode dispatched by train.py (train | infer)
mode: "train"

# Model settings
model_id: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
# A14B is a 2-expert MoE. high-noise handles t >= boundary_ratio, low-noise below.
boundary_ratio: 0.875
# "low" | "high" | "both". "low" alone is often enough for a style LoRA and keeps
# only one 14B expert resident.
train_experts: "both"
dtype: "bfloat16"
# ttnn dtype for the on-device VAE encoder.
vae_dtype: "bfloat16"
# -> RunnerType.MemoryEfficient (activation recompute)
gradient_checkpointing: True

# Dataset / cache settings
dataset_id: "showlab/OmniConsistency"
style: "LEGO"
data_dir: "data/lego"
cache_dir: "cache/wan22_14b_lego_kurbla"
# h/w must be multiples of 16 (VAE spatial stride 8 * patch 2); frames must be 4k+1.
train_h: 512
train_w: 512
train_frames: 13
# Rare token: the base model ignores it, the LoRA learns it -> style trigger.
trigger: "lg, "
# Drop "lego/blocky/minifigure" clauses so the trigger alone carries the style.
strip_style_words: True
# Fraction of samples whose caption becomes "" (classifier-free guidance).
text_drop_prob: 0.10
# 0 = use every sample.
subset_size: 0
max_seq: 512
val_holdout: 4

# LoRA setup
lora_rank: 32
lora_alpha: 32
# "attn" reproduces what the CUDA reference actually trains; "attn+ffn" what it
# intended (see README on the ff/ffn mismatch).
lora_target_set: "attn"
# "gaussian" matches PEFT's N(0, 1/rank); "kaiming" is ttml's own init, ~4x
# smaller at rank 32 (see README known differences).
lora_a_init: "gaussian"
lora_path: "cache/wan22_14b_lego_kurbla/wan22_14b_lego_lora.safetensors"

# Training hyperparameters
learning_rate: 1.0e-4
weight_decay: 0.01
# Must be 0 at TP>1: ttml.core.clip_grad_norm is per-device.
grad_clip: 0
# Global batch: 1 per chip x DP 4. Must divide by the input_sharding_dim axis width.
batch_size: 4
gradient_accumulation_steps: 4
max_steps: 3000
val_loss_every: 200
ckpt_every: 250
resume_step: 0

# Flow-matching training
train_flow_shift: 3.0
lognorm_mean: 0.0
lognorm_std: 1.0

# Inference / validation video generation
inference:
  infer_h: 512
  infer_w: 512
  # 4k+1 only; other values decode to black video.
  infer_frames: 49
  infer_fps: 16
  infer_steps: 40
  infer_guidance: 7.0
  infer_guidance_2: 5.0
  infer_flow_shift: 12.0
  infer_output: "cache/wan22_14b_lego_kurbla/lego_video.mp4"
  # The prompt to generate; the trigger above is prepended automatically.
  val_prompt: "a cat sitting on a wooden table"
  neg_prompt: ""
  # true = run the base model with no adapter (A/B against a trained run).
  infer_no_lora: False
  # Over-drive the adapter (1.5-2.0) to survive temporal dilution in video.
  lora_scale: 1.0
  # Leave empty to derive both from lora_path.
  infer_high_lora: ""
  infer_low_lora: ""

# Device settings.
#
# mesh_shape is [DP, TP]; mesh_axis_names names those axes in the same order, so "batch"
# is the data-parallel axis and "model" the tensor-parallel one. [4, 8] = all 32 chips of
# a Blackhole Galaxy. Set mesh_shape: null for a single chip (no DTensor, no collectives),
# which is the rung to start from.
mesh_shape: [4, 8]
mesh_axis_names: ["batch", "model"]

input_sharding_dim: "batch"

# Column-parallel (QKV, FFN-up, *_embedder.linear_1) -> ["model", null].
# Row-parallel (O, FFN-down, *_embedder.linear_2, time_proj) -> [null, "model"].
# Nothing names "batch", so that axis carries data, not weights: 4 replicas, each 8-way
# tensor-parallel. First re.search hit wins, so order matters.
model_sharding_patterns:
  # The whole conditioning path stays replicated (233M params, ~0.5 GiB/chip/expert). Any
  # row-parallel layer here leaves temb Partial, and DTensor does not resolve
  # Replicate + Partial on a 2-D mesh: the Partial survives into the AdaLN `1 + scale`,
  # where the scalar lands once per shard and scales the hidden state by the TP width.
  - ['^condition_embedder\.', [null, null]]

  - ['\bblocks\.\d+\.attn[12]\.to_q\.base_layer$', ["model", null]]
  - ['\bblocks\.\d+\.attn[12]\.to_k\.base_layer$', ["model", null]]
  - ['\bblocks\.\d+\.attn[12]\.to_v\.base_layer$', ["model", null]]
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.base_layer$', [null, "model"]]
  # Exact only because the RMS sum of squares is separable; needs the rms_norm patch, or
  # DTensor all-gathers q/k back to 5120 and every chip runs all 40 heads.
  - ['\bblocks\.\d+\.attn[12]\.norm_q$', ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.norm_k$', ["model"]]

  # Shard whichever LoRA side meets the sharded activation; rank 32 is never split.
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.lora_A\.default$', [null, "model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.lora_B\.default$', [null, null]]
  - ['\bblocks\.\d+\.attn[12]\.to_[qkv]\.lora_A\.default$', [null, null]]
  - ['\bblocks\.\d+\.attn[12]\.to_[qkv]\.lora_B\.default$', ["model", null]]

  # (\.base_layer)? so these keep matching if lora_target_set becomes "attn+ffn".
  - ['\bblocks\.\d+\.ffn\.net\.0\.proj(\.base_layer)?$', ["model", null]]
  - ['\bblocks\.\d+\.ffn\.net\.2(\.base_layer)?$', [null, "model"]]

  # Replicated on purpose, listed so the sharded/replicated tally is auditable.
  - ['\bblocks\.\d+\.norm2$', [null]]
  - ['^patch_embedding$', [null, null, null, null, null]]
  - ['^proj_out$', [null, null]]

param_sharding_patterns:
  - ['^condition_embedder\..*\.bias$', [null]]
  - ['\bblocks\.\d+\.attn[12]\.to_q\.base_layer\.bias$', ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_k\.base_layer\.bias$', ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_v\.base_layer\.bias$', ["model"]]
  # Row-parallel bias is added once, after the all-reduce.
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.base_layer\.bias$', [null]]
  - ['\bblocks\.\d+\.ffn\.net\.0\.proj(\.base_layer)?\.bias$', ["model"]]
  - ['\bblocks\.\d+\.ffn\.net\.2(\.base_layer)?\.bias$', [null]]
  - ['\bblocks\.\d+\.norm2\.(weight|bias)$', [null]]
  - ['\bblocks\.\d+\.scale_shift_table$', [null, null, null]]
  - ['^scale_shift_table$', [null, null, null]]
  - ['^patch_embedding\.bias$', [null]]
  - ['^proj_out\.bias$', [null]]

# CompileOption.OPT_LEVEL, and whether the optimizer step is captured as one graph.
optimization_level: 0
compile_optimizer: false

# Precompute's own mesh, [DP, TP]. All 32 on DP: one sample per chip, nothing to shard.
vae_parallel_shape: [32, 1]

# Reproducibility settings
seed: 42

# Logging settings
log_level: "INFO"
use_wandb: True
wandb_project: "wan22-14b-lego-lora-kurbla"
wandb_run_name: "tt-wan22-a14b-lego-galaxy"
wandb_tags: ["test"]

# Other settings
framework: "pytorch"
project_dir: "blacksmith/experiments/torch/wan2_2_a14b"
