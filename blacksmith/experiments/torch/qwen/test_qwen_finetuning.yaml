# Dataset settings
dataset_id: "gretelai/synthetic_text_to_sql"

# Model settings
# model_name: "meta-llama/Llama-3.2-1B"
# model_name: "tiiuae/Falcon3-1B-Base"
# model_name: "google/gemma-1.1-2b-it"
model_name: "Qwen/Qwen2.5-0.5B"
max_length: 128
dtype: "torch.bfloat16"

# Training hyperparameters
learning_rate: 2e-5
batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: False
num_epochs: 1
optim: "adamw_torch"

# Logging settings
log_level: "INFO"
use_wandb: False
wandb_project: "qwen-finetuning"
wandb_run_name: "tt-qwen-test"
wandb_tags: ["test"]
wandb_watch_mode: "all"
wandb_log_freq: 1000
model_to_wandb: False
steps_freq: 25
epoch_freq: 1

# Checkpoint settings
resume_from_checkpoint: False
resume_option: "last"  # [last, best, path]
checkpoint_path: "" # path to checkpoint if resume_option is "path"
save_strategy: "none"
project_dir: "blacksmith/experiments/torch/qwen"
save_optim: False
storage_backend: "local"
sync_to_storage: False
load_from_storage: False
remote_path: ""

# Reproducibility settings
seed: 23
deterministic: False

# LoRA setup
lora_r: 4
lora_alpha: 8
lora_target_modules: ["q_proj", "v_proj"]
lora_task_type: "CAUSAL_LM"

# Other settings
framework: "pytorch"
use_tt: False
