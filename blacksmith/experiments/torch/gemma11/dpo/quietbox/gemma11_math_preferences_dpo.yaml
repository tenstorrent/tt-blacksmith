# Gemma 1.1 2B DPO (Direct Preference Optimization) - multi-chip configuration.
# 4 chips arranged as a 2D mesh: 2-way data parallel x 2-way tensor parallel.
# Paper: https://arxiv.org/pdf/2305.18290
# Model: https://huggingface.co/google/gemma-1.1-2b-it
# Dataset: argilla/distilabel-math-preference-dpo

# Training type
training_model_type: "lora"

# Dataset settings
dataset_id: "math_preference_dpo"

# Model settings
model_name: "google/gemma-1.1-2b-it"
max_length: 1024
dtype: "torch.bfloat16"
ignored_index: -100

# DPO-specific hyperparameters
dpo_beta: 0.2  # Temperature for DPO loss (higher = more conservative)
dpo_label_smoothing: 0.0  # Label smoothing (0 = no smoothing)

# Reference model settings
# Standard DPO requires π_ref to be the SFT model trained on the chosen responses.
# Run the multi-chip SFT config first, then set this to the resulting checkpoint, e.g.:
#   blacksmith/experiments/torch/gemma11/lora/checkpoints/checkpoint_step<STEP>_epoch<EPOCH>_<TIMESTAMP>.pt
# The SFT checkpoint filename is timestamped, so fill it in after SFT finishes (or pass it on the
# command line via --reference-model-checkpoint-path, which overrides this field).
sft_checkpoint_path: "blacksmith/experiments/torch/gemma11/lora/checkpoints/checkpoint_step186_epoch2_20260706_120226.pt"

# Training hyperparameters
learning_rate: 1e-5  # Learning rate for DPO
batch_size: 4  # Global batch; sharded across the 2-way "batch" (data-parallel) mesh axis -> 1 per DP rank.
gradient_accumulation_steps: 8
gradient_checkpointing: False
weight_decay: 0.0
num_epochs: 10
max_steps: -1  # -1 means use num_epochs
optim: "adamw_torch"
warmup_steps: 5

# Logging settings
log_level: "INFO"
use_wandb: True
wandb_project: "gemma11-dpo"
wandb_run_name: "tt-gemma11-dpo-math-multichip"
wandb_tags: ["gemma11", "dpo", "math", "lora", "multichip"]
wandb_watch_mode: "all"
wandb_log_freq: 1000
model_to_wandb: False
steps_freq: 10
epoch_freq: 1
val_steps_freq: 32
print_examples: False
do_validation: True

# Checkpoint settings
resume_from_checkpoint: False
resume_option: "last"
checkpoint_path: ""
checkpoint_metric: "val/accuracy"
checkpoint_metric_mode: "max"
keep_last_n: 3
keep_best_n: 1
save_strategy: "step"
save_steps: 32
project_dir: "blacksmith/experiments/torch/gemma11/dpo"
save_optim: False
storage_backend: "local"
sync_to_storage: False
load_from_storage: False
remote_path: ""

# Reproducibility settings
seed: 23  # Match SFT seed for consistent data splits
deterministic: True

# Device settings (4 chips: 2D mesh of data parallel x tensor parallel)
mesh_shape: [2, 2]
mesh_axis_names: ["batch", "model"]  # "batch" = data parallel, "model" = tensor parallel
input_sharding_dim: "batch"          # shard input batch dim across the data-parallel axis
# Tensor-parallel sharding patterns (regex on module name -> partition spec per weight dim).
# Gemma 1.1 2B uses multi-query attention (1 KV head, 8 query heads, head_dim=256), so K/V
# projections are left REPLICATED; only Q/O and the MLP are sharded across the "model" axis.
model_sharding_patterns:
  # === Attention: q_proj column-parallel (shard output), o_proj row-parallel (shard input) ===
  - ['\.self_attn\.q_proj\.base_layer$',      ["model", null]]
  - ['\.self_attn\.q_proj\.lora_B\.default$', ["model", null]]
  - ['\.self_attn\.o_proj\.base_layer$',      [null, "model"]]
  - ['\.self_attn\.o_proj\.lora_A\.default$', [null, "model"]]
  # === MLP: gate/up column-parallel, down row-parallel (not LoRA-targeted -> plain Linear) ===
  - ['\.mlp\.gate_proj$', ["model", null]]
  - ['\.mlp\.up_proj$',   ["model", null]]
  - ['\.mlp\.down_proj$', [null, "model"]]

# LoRA setup - larger rank for DPO to capture preference learning
lora_r: 16
lora_alpha: 32
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
lora_task_type: "CAUSAL_LM"
lora_dropout: 0.0  # Disable dropout for stable DPO training

# Adapter setup (used when training_model_type is "adapters")
adapter_bottleneck_dim: 32
adapter_non_linearity: "torch.nn.GELU"
adapter_layers: []

# Other settings
framework: "pytorch"
use_tt: True
