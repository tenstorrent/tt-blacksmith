# Dataset settings
dataset_id: "fusechat"

# Model settings
model_name: "meta-llama/Llama-3.2-3B"
max_length: 128
dtype: "torch.bfloat16"

# Training hyperparameters
training_model_type: "lora"
learning_rate: 2e-4
gradient_accumulation_steps: 16
batch_size: 1
num_epochs: 5
ignored_index: -100

# LoRA setup
lora_r: 16
lora_alpha: 32
lora_target_modules: ["q_proj", "v_proj"]
lora_task_type: "CAUSAL_LM"

# Device settings
mesh_shape: null
mesh_axis_names: null

# Reproducibility settings
seed: 23
deterministic: False

# Logging settings
log_level: "INFO"
use_wandb: True
wandb_project: "llama3b-singlechip-lora"
wandb_run_name: "tt-llama3b-test"
wandb_tags: ["test"]
wandb_watch_mode: "all"
wandb_log_freq: 1000
model_to_wandb: False
steps_freq: 5
val_steps_freq: 5
epoch_freq: 1

# Checkpoint settings
resume_from_checkpoint: False
resume_option: "last"  # [last, best, path]
checkpoint_path: "" # path to checkpoint if resume_option is "path"
checkpoint_metric: "eval/loss"
checkpoint_metric_mode: "min"  # [min, max]
keep_last_n: 2
keep_best_n: 1
save_strategy: "step"
project_dir: "blacksmith/experiments/torch/llama/xla/lora"
save_optim: True
storage_backend: "local"
sync_to_storage: False
load_from_storage: False
remote_path: ""

# Other settings
framework: "pytorch"
print_examples: True
use_tt: True
