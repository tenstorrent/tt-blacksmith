# Dataset settings
dataset_id: "alpaca"

# Model settings
model_name: "meta-llama/Llama-3.2-1B"
max_length: 512
dtype: "torch.bfloat16"

# Training hyperparameters
training_type: "full"
learning_rate: 2e-5
batch_size: 8
gradient_accumulation_steps: 1
num_epochs: 1
ignored_index: -100
lr_scheduler: "cosine"
warmup_ratio: 0.03
max_grad_norm: 1.0
weight_decay: 0.01

# Reproducibility settings
seed: 23
deterministic: False

# Logging settings
log_level: "INFO"
use_wandb: True
wandb_project: "llama1b-singlechip-full"
wandb_run_name: "tt-llama1b-gpu"
wandb_tags: ["test"]
wandb_watch_mode: "all"
wandb_log_freq: 5
model_to_wandb: False
steps_freq: 5
val_steps_freq: 25
epoch_freq: 1
run_decode_example: True

# Checkpoint settings
resume_from_checkpoint: False
resume_option: "last"  # [last, best, path]
checkpoint_path: "" # path to checkpoint if resume_option is "path"
checkpoint_metric: "eval/loss"
checkpoint_metric_mode: "min"  # [min, max]
keep_last_n: 2
keep_best_n: 1
save_strategy: "step"
project_dir: "blacksmith/experiments/torch/llama/xla/full"
save_optim: True
storage_backend: "local"
sync_to_storage: False
load_from_storage: False
remote_path: ""

# Other settings
framework: "pytorch"
print_examples: True
use_tt: False
