# Dataset settings
dataset_id: "alpaca"

# Model settings
model_name: "meta-llama/Llama-3.2-1B"
max_length: 512
dtype: "torch.bfloat16"

# Training hyperparameters
training_type: "full"
learning_rate: 2e-5
batch_size: 2
gradient_accumulation_steps: 16
num_epochs: 1
ignored_index: -100

# Device settings
mesh_shape: [1, 2]  
mesh_axis_names: ["batch", "model"]
input_sharding_dim: "batch"
# Sharding patterns for tensor parallelism (regex pattern -> partition spec)
model_sharding_patterns:
  # === Attention ===
  - ['\.self_attn\.q_proj$', ["model", null]]
  - ['\.self_attn\.k_proj$', ["model", null]]
  - ['\.self_attn\.v_proj$', ["model", null]]
  - ['\.self_attn\.o_proj$', [null, "model"]]
  # === MLP ===
  - ['\.mlp\.gate_proj$', ["model", null]]
  - ['\.mlp\.up_proj$',   ["model", null]]
  - ['\.mlp\.down_proj$', [null, "model"]]

# Reproducibility settings
seed: 23
deterministic: False

# Logging settings
log_level: "INFO"
use_wandb: True
wandb_project: "llama1b-multichip-full"
wandb_run_name: "tt-llama1b-test"
wandb_tags: ["test"]
wandb_watch_mode: "all"
wandb_log_freq: 1000
model_to_wandb: False
steps_freq: 5
val_steps_freq: 5
epoch_freq: 1
run_decode_example: True

# Checkpoint settings
resume_from_checkpoint: False
resume_option: "last"  # [last, best, path]
checkpoint_path: "" # path to checkpoint if resume_option is "path"
checkpoint_metric: "eval/loss"
checkpoint_metric_mode: "min"  # [min, max]
keep_last_n: 2
keep_best_n: 1
save_strategy: "step"
project_dir: "blacksmith/experiments/torch/llama/xla/full"
save_optim: True
storage_backend: "local"
sync_to_storage: False
load_from_storage: False
remote_path: ""

# Other settings
framework: "pytorch"
print_examples: True
use_tt: True
