# Llama 3.1 8B LoRA fine-tuning on SST-2, multichip, via tt-crank.
#
# 2x4 mesh (Wormhole QuietBox): data parallel over `batch`, Megatron tensor
# parallel over `model`. Unlike the tt-xla config there are no per-module
# regex sharding patterns -- tt-crank uses DTensor, and the column/row-parallel
# rules live in blacksmith/tools/device_manager.py.

# Dataset settings
dataset_id: "sst2"

# Model settings
model_name: "meta-llama/Llama-3.1-8B"
max_length: 64
dtype: "torch.bfloat16"

# Training hyperparameters
learning_rate: 2e-4
batch_size: 16
gradient_accumulation_steps: 2
num_epochs: 1
ignored_index: -100
training_model_type: "lora"  # [lora, adapters]

# LoRA setup
lora_r: 4
lora_alpha: 8
lora_target_modules: ["q_proj", "v_proj"]
lora_task_type: "CAUSAL_LM"

# Device settings
mesh:
  shape: [2, 4]
  axis_names: ["batch", "model"]
  data_axis: "batch"
  tensor_axis: "model"

# tt-crank compile options
optimization_level: 0
enable_const_eval: true
enable_trace: false
math_fidelity: "HiFi4"
fp32_dest_acc_en: true

# Logging settings
log_level: "INFO"
use_wandb: true
wandb_project: "llama8b-multichip-lora-crank"
wandb_run_name: "tt-crank-llama8b-test"
wandb_tags: ["crank", "multichip", "test"]
wandb_watch_mode: "all"
wandb_log_freq: 1000
model_to_wandb: False
steps_freq: 5
val_steps_freq: 5
epoch_freq: 1

# Checkpoint settings
save_strategy: "step"
output_dir: "results/llama_3_1_8b_crank"
project_dir: "results/llama_3_1_8b_crank"  # CheckpointManager writes to <project_dir>/checkpoints
keep_last_n: 2
keep_best_n: 1
checkpoint_metric: "eval/loss"
checkpoint_metric_mode: "min"  # [min, max]
save_optim: True
resume_from_checkpoint: False
resume_option: "last"  # [last, best, path]
checkpoint_path: ""  # path to checkpoint if resume_option is "path"
storage_backend: "local"
sync_to_storage: False
load_from_storage: False
remote_path: ""

# Reproducibility settings
seed: 23
deterministic: False

# Other settings
use_tt: true
framework: "pytorch"
print_examples: True
