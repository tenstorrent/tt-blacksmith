# Llama 3.2 1B LoRA fine-tuning on SST-2, single chip, via tt-crank.

# Dataset settings
dataset_id: "sst2"

# Model settings
model_name: "meta-llama/Llama-3.2-1B"
max_length: 64
dtype: "torch.bfloat16"

# Training hyperparameters
learning_rate: 1e-4
batch_size: 16
gradient_accumulation_steps: 1
num_epochs: 1
ignored_index: -100

# LoRA setup
lora_r: 4
lora_alpha: 8
lora_target_modules: ["q_proj", "v_proj"]
lora_task_type: "CAUSAL_LM"

# Device settings: no `mesh` block => single chip.

# tt-crank compile options
optimization_level: 0
enable_const_eval: true
enable_trace: false
# Highest numerical precision, for stable fine-tuning convergence:
# fp32_dest_acc_en accumulates partials in FP32, HiFi4 uses all four mantissa
# phases for full-precision multiplies.
math_fidelity: "HiFi4"
fp32_dest_acc_en: true

# Logging settings
log_level: "INFO"
use_wandb: true
wandb_project: "llama1b-singlechip-lora-crank"
wandb_run_name: "tt-crank-llama1b-test"
wandb_tags: ["crank", "test"]
steps_freq: 5
val_steps_freq: 5

# Checkpoint settings
save_strategy: "step"
output_dir: "results/llama_3_2_1b_crank"
keep_last_n: 2

# Reproducibility settings
seed: 23

# Other settings
use_tt: true
