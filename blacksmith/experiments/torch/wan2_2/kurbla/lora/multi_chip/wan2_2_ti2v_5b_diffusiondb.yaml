mode: train

model_id: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
dtype: "torch.bfloat16"
vae_precompute_dtype: "torch.bfloat16"
gradient_checkpointing: false

dit_layers: 30
text_encoder_layers: 24

dataset_id: "jainr3/diffusiondb-pixelart"
cache_dir: "cache/wan22_5b_kurbla"
subset_size: 64
val_holdout: 4

train_h: 480
train_w: 832

inference:
  infer_h: 480
  infer_w: 832
  infer_frames: 65
  infer_fps: 16
  infer_steps: 40
  infer_guidance: 5.0
  infer_flow_shift: 5.0
  infer_output: "cache/wan22_5b/pixelart_video.mp4"
  val_prompt: "a train speeding through snowy fields, distant forest in background"
  val_img_steps: 40
  val_img_frames: 1
  neg_prompt: ""

trigger: "pxa, "
text_drop_prob: 0.10

lora_rank: 32
lora_alpha: 32

lora_targets: ["to_q", "to_k", "to_v", "to_out.0", "ff.net.0.proj", "ff.net.2"]

learning_rate: 1.0e-4
weight_decay: 0.01
batch_size: 1
gradient_accumulation_steps: 2
max_steps: 3000

validate_at_start: false

train_flow_shift: 3.0
lognorm_mean: 0.0
lognorm_std: 1.0

log_level: "INFO"
use_wandb: false
wandb_project: "wan22-pixelart-lora"
steps_freq: 1
val_steps_freq: 10

resume_from_checkpoint: false
resume_option: "last"
checkpoint_path: ""
save_strategy: "step"
project_dir: "blacksmith/experiments/torch/wan2_2/kurbla"
save_optim: true

seed: 42

use_tt: true

compile_optimizer: true
optimization_level: 1

mesh_shape: [4, 8]
mesh_axis_names: ["batch", "model"]

input_sharding_dim: null
# Column-parallel (QKV / FFN-up) -> ["model", "batch"]; row-parallel (O / FFN-down)
# -> ["batch", "model"]. LoRA A/B keep the rank dim replicated.
# Each pattern is anchored to one component (UMT5 / VAE / DiT)
# so the single list applies cleanly to all of them via shard_model.
model_sharding_patterns:
  # === UMT5 text encoder ===
  - ['^shared$',                                  [null, "batch"]]
  - ['\.layer\.0\.SelfAttention\.q$',             ["model", "batch"]]
  - ['\.layer\.0\.SelfAttention\.k$',             ["model", "batch"]]
  - ['\.layer\.0\.SelfAttention\.v$',             ["model", "batch"]]
  - ['\.layer\.0\.SelfAttention\.o$',             ["batch", "model"]]
  - ['\.layer\.0\.layer_norm$',                   ["batch"]]
  - ['\.layer\.1\.DenseReluDense\.wi_0$',         ["model", "batch"]]
  - ['\.layer\.1\.DenseReluDense\.wi_1$',         ["model", "batch"]]
  - ['\.layer\.1\.DenseReluDense\.wo$',           ["batch", "model"]]
  - ['\.layer\.1\.layer_norm$',                   ["batch"]]
  - ['^encoder\.final_layer_norm$',               ["batch"]]
  # === VAE (encoder seeds + decoder seeds) ===
  # - ['^quant_conv$',                              ["batch", null, null, null, null]]
  # - ['^post_quant_conv$',                         ["batch", null, null, null, null]]
  # - ['^encoder\.conv_in$',                        ["batch", null, null, null, null]]
  # - ['^decoder\.conv_in$',                        ["batch", null, null, null, null]]
  # === DiT (WanTransformer3DModel) ===
  - ['^patch_embedding$',                         ["batch", null, null, null, null]]
  - ['^proj_out$',                                [null, "batch"]]
  - ['^condition_embedder\.time_embedder\.linear_1$', ["model", "batch"]]
  - ['^condition_embedder\.time_embedder\.linear_2$', ["batch", "model"]]
  # Replicated on purpose. time_proj is Linear(3072, 6*3072) and the DiT reads its
  # output as 6 groups of 3072 (`timestep_proj.unflatten(2, (6, -1))`, the AdaLN
  # shift/scale/gate pairs). Splitting the flat 18432 over "batch" gives contiguous
  # 4608-column shards -- 1.5 groups each -- so the shard boundaries cut through the
  # groups and the unflatten is unrepresentable ("Attempted to split the sharded
  # dimension 2 into multiple subdimensions"). Replicating costs ~85 MB/chip and one
  # extra copy of a matmul worth ~1% of the DiT's FLOPs; the chunks it feeds are then
  # sliced to Shard(last)/"batch" for free when they meet scale_shift_table.
  - ['^condition_embedder\.time_proj$',           [null, null]]
  - ['^condition_embedder\.text_embedder\.linear_1$', ["model", "batch"]]
  - ['^condition_embedder\.text_embedder\.linear_2$', ["batch", "model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_q\.base_layer$',      ["model", "batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_k\.base_layer$',      ["model", "batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_v\.base_layer$',      ["model", "batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.base_layer$', ["batch", "model"]]
  - ['\bblocks\.\d+\.attn[12]\.norm_q$',                ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.norm_k$',                ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_q\.lora_A\.default$',      [null, "batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_q\.lora_B\.default$',      ["model", null]]
  - ['\bblocks\.\d+\.attn[12]\.to_k\.lora_A\.default$',      [null, "batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_k\.lora_B\.default$',      ["model", null]]
  - ['\bblocks\.\d+\.attn[12]\.to_v\.lora_A\.default$',      [null, "batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_v\.lora_B\.default$',      ["model", null]]
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.lora_A\.default$', [null, "model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.lora_B\.default$', ["batch", null]]
  - ['\bblocks\.\d+\.ffn\.net\.0\.proj$',         ["model", "batch"]]
  - ['\bblocks\.\d+\.ffn\.net\.2$',               ["batch", "model"]]
  # Replicated on purpose. norm2 is `FP32LayerNorm(dim, eps, elementwise_affine=True)`,
  # and LayerNorm's normalized dim is the hidden dim -- mean and variance need the whole
  # vector, so DTensor keeps the *input* replicated along it. A sharded weight then does
  # not match: native_layer_norm_backward's decomposition runs on local tensors and
  # multiplies a [1, tokens, 3072] grad by a [768] weight ("Attempting to broadcast a
  # dimension of length 768 at -1"). The weight is 3072 values; sharding it saves nothing.
  - ['\bblocks\.\d+\.norm2$',                     [null]]
param_sharding_patterns:
  # === DiT biases + scale/shift tables (top-level and per-block) ===
  - ['scale_shift_table$',                        [null, null, "batch"]]
  - ['^patch_embedding\.bias$',                   ["batch"]]
  - ['^proj_out\.bias$',                          [null]]
  - ['^condition_embedder\.time_embedder\.linear_1\.bias$', ["model"]]
  - ['^condition_embedder\.time_embedder\.linear_2\.bias$', ["batch"]]
  # Must follow the weight above: a sharded bias on a replicated weight's output would
  # be added to the wrong columns.
  - ['^condition_embedder\.time_proj\.bias$',     [null]]
  - ['^condition_embedder\.text_embedder\.linear_1\.bias$', ["model"]]
  - ['^condition_embedder\.text_embedder\.linear_2\.bias$', ["batch"]]
  - ['\bblocks\.\d+\.attn[12]\.to_q\.base_layer\.bias$',      ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_k\.base_layer\.bias$',      ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_v\.base_layer\.bias$',      ["model"]]
  - ['\bblocks\.\d+\.attn[12]\.to_out\.0\.base_layer\.bias$', ["batch"]]
  - ['\bblocks\.\d+\.ffn\.net\.0\.proj\.bias$',   ["model"]]
  - ['\bblocks\.\d+\.ffn\.net\.2\.bias$',         ["batch"]]
  # Must follow the weight above.
  - ['\bblocks\.\d+\.norm2\.bias$',               [null]]
  # # === VAE conv biases ===
  # - ['^quant_conv\.bias$',                        ["batch"]]
  # - ['^post_quant_conv\.bias$',                   ["batch"]]
  # - ['^encoder\.conv_in\.bias$',                  ["batch"]]
  # - ['^decoder\.conv_in\.bias$',                  ["batch"]]
