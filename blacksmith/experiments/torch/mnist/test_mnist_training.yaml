experiment_name: blacksmith-mnist-training
pjrt_plugin_path: "third_party/tt-xla/build/src/tt/pjrt_plugin_tt.so"
tags:
  - tt-xla
  - model:torch
  - plugin
  - wandb
device: "TT"
training_config:
  train_ratio: 0.8
  batch_size: 64
  epochs: 5
  lr: 0.001
net_config:
  input_size: 784
  hidden_size: 512
  output_size: 10
  bias: True
data_loading_config:
  batch_size: 64
  dtype: bfloat16
  pre_shuffle: True
loss: torch.nn.MSELoss
