# TT-N150 Configuration for NanoGPT Training
# This configuration is optimized for TT-N150 hardware

model:
  n_layer: 12  # Full model size
  n_head: 12
  n_embd: 768
  block_size: 1024  # Full context length
  vocab_size: 50304
  dropout: 0.0
  bias: false

data:
  dataset: "openwebtext"  # Full dataset
  data_dir: "data"
  batch_size: 12  # Larger batch size for TT
  block_size: 1024
  num_workers: 4
  pin_memory: true

training:
  learning_rate: 6e-4  # Standard learning rate
  max_iters: 600000  # Full training
  weight_decay: 1e-1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  decay_lr: true
  warmup_iters: 2000
  lr_decay_iters: 600000
  min_lr: 6e-5
  eval_interval: 2000
  eval_iters: 200
  log_interval: 1
  always_save_checkpoint: true
  device: "tt"
  compile: true  # Enable compilation for TT
  dtype: "float32"

device:
  primary_device: "tt"
  enable_fallback: true
  fallback_device: "cpu"
  cpu_batch_size: 8
  tt_batch_size: 12

logging:
  log_on_wandb: true
  wandb_project: "nanogpt-jax-tt"
  wandb_run_name: "nanogpt-tt-n150"
  checkpoint_dir: "checkpoints_tt"
  save_interval: 2000
  max_checkpoints: 3
  log_every_n_steps: 10
  log_metrics: true
  log_gradients: false

early_stopping:
  enabled: false
  patience: 10
  min_delta: 0.001
  monitor: "val_loss"

# Experiment metadata
experiment_name: "nanogpt-jax-tt"
seed: 42
resume: false
resume_from_checkpoint: null
