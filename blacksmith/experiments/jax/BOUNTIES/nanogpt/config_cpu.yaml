# CPU Configuration for NanoGPT Training
# This configuration is identical to TT config for fair comparison

model:
  n_layer: 12  # Same as TT config
  n_head: 12
  n_embd: 768
  block_size: 1024  # Same as TT config
  vocab_size: 50304
  dropout: 0.0
  bias: false

data:
  dataset: "openwebtext"  # Same as TT config
  data_dir: "data"
  batch_size: 12  # Same as TT config
  block_size: 1024
  num_workers: 4
  pin_memory: true

training:
  learning_rate: 6e-4  # Same as TT config
  max_iters: 600000  # Same as TT config
  weight_decay: 1e-1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  decay_lr: true
  warmup_iters: 2000
  lr_decay_iters: 600000
  min_lr: 6e-5
  eval_interval: 2000
  eval_iters: 200
  log_interval: 1
  always_save_checkpoint: true
  device: "cpu"  # Only difference: device type
  compile: false  # Disable compilation for CPU
  dtype: "float32"

device:
  primary_device: "cpu"  # Only difference: device type
  enable_fallback: true
  fallback_device: "cpu"
  cpu_batch_size: 8
  tt_batch_size: 12

logging:
  log_on_wandb: true
  wandb_project: "nanogpt-jax-cpu"
  wandb_run_name: "nanogpt-cpu-baseline"
  checkpoint_dir: "checkpoints_cpu"
  save_interval: 2000
  max_checkpoints: 3
  log_every_n_steps: 10
  log_metrics: true
  log_gradients: false

early_stopping:
  enabled: false
  patience: 10
  min_delta: 0.001
  monitor: "val_loss"

# Experiment metadata
experiment_name: "nanogpt-jax-cpu"
seed: 42
resume: false
resume_from_checkpoint: null
