# Dataset settings
dataset_id: "sst2"

# Model settings
model_name: "meta-llama/Llama-3.1-8B"
max_length: 128
dtype: "bfloat16"

# Training hyperparameters
learning_rate: 1e-4
batch_size: 8
gradient_accumulation_steps: 1
num_epochs: 1
weight_decay: 0.0

# LoRA setup (required: the ttml Llama provider only trains LoRA adapters;
# k_proj and v_proj are one fused projection, so target both or neither)
lora:
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj"]
  task_type: "CAUSAL_LM"

# Validation settings
val_steps_freq: 10

# Logging settings
logging:
  log_level: "INFO"
  use_wandb: True
  wandb_project: "llama8b-p150-lora-ttml"
  wandb_run_name: "ttml-llama8b-test"
  wandb_tags: ["test"]
  wandb_watch_mode: "all"
  wandb_log_freq: 1000
  model_to_wandb: False

# Metrics settings
metrics:
  steps_freq: 10
  train_metrics: ["loss"]
  val_metrics: ["loss"]

# Checkpoint settings
checkpoint:
  steps_freq: 10
  epoch_freq: 1
  save_strategy: "step"
  project_dir: "outputs/ttml/llm/lora/single_chip/llama_3_1_8b_sst2"
  final_checkpoint_name: "final_adapter"
  save_optim: False
  keep_last_n: 2
  keep_best_n: 1
  keep_all_checkpoints: False
  checkpoint_metric: "val/loss"
  checkpoint_metric_mode: "min"
  init_from_checkpoint: False
  init_option: "last"
  checkpoint_path: ""

# Reproducibility settings
seed: 23
deterministic: False

# Device settings - single chip (no mesh).
use_tt: True
