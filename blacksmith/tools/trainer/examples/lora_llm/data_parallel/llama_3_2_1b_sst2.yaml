# Dataset settings
dataset_id: "sst2"

# Model settings
model_name: "meta-llama/Llama-3.2-1B"
max_length: 64
dtype: "torch.bfloat16"

# Training hyperparameters
training_model_type: "lora"
learning_rate: 1e-4
batch_size: 16
gradient_accumulation_steps: 1
num_epochs: 1
optim: "adamw_torch"
weight_decay: 0.0

# LoRA setup
lora_r: 4
lora_alpha: 8
lora_target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
lora_task_type: "CAUSAL_LM"

# Validation settings
val_steps_freq: 10

mesh_shape: [1, 2]
mesh_axis_names: ["model", "batch"]
input_sharding_dim: "batch"

# Logging settings
logging:
  log_level: "INFO"
  use_wandb: True
  wandb_project: "llama1b-data-parallel-lora"
  wandb_run_name: "tt-llama1b-dp-test"
  wandb_tags: ["test"]
  wandb_watch_mode: "all"
  wandb_log_freq: 1000
  model_to_wandb: False

# Metrics settings
metrics:
  steps_freq: 10
  epoch_freq: 1
  train_metrics: ["loss"]
  val_metrics: ["loss"]

# Checkpoint settings
checkpoint:
  steps_freq: 10
  epoch_freq: 1
  save_strategy: "step"
  project_dir: "blacksmith/tools/trainer/examples/lora_llm/data_parallel"
  final_checkpoint_name: "final_model.pth"
  save_optim: False
  keep_last_n: 3
  keep_best_n: 3
  checkpoint_metric: "eval/loss"
  checkpoint_metric_mode: "min"
  storage_backend: "local"
  sync_to_storage: False
  load_from_storage: False
  remote_path: ""
  resume_from_checkpoint: False
  resume_option: "last"
  checkpoint_path: ""

# Reproducibility settings
framework: "pytorch"
seed: 23
deterministic: False

# Device settings
use_tt: True
