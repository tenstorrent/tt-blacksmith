# Dataset settings
dataset_id: "custom"
custom_dataset:
  file_type: "json"
  train_dataset_path: "path/to/local/train.json"
  val_dataset_path: "path/to/local/val.json"
  template: "alpaca"
  column_mapping: {
    "instruction": "instruction",
    "input": "context",
    "output": "response"
  }


# Model settings
model_name: "meta-llama/Llama-3.2-1B"
max_length: 64
dtype: "torch.bfloat16"

# Training hyperparameters
learning_rate: 1e-4
batch_size: 16
gradient_accumulation_steps: 1
num_epochs: 1
weight_decay: 0.0

# LoRA setup (optional; omit this block for full fine-tuning)
lora:
  r: 4
  alpha: 8
  target_modules: ["q_proj", "v_proj"]
  task_type: "CAUSAL_LM"

# Validation settings
val_steps_freq: 10

# Logging settings
logging:
  log_level: "INFO"
  use_wandb: True
  wandb_project: "llama1b-custom-lora"
  wandb_run_name: "custom-llama1b-test"
  wandb_tags: ["test"]
  wandb_watch_mode: "all"
  wandb_log_freq: 1000
  model_to_wandb: False

# Metrics settings
metrics:
  steps_freq: 10
  train_metrics: ["loss"]
  val_metrics: ["loss"]

# Checkpoint settings
checkpoint:
  steps_freq: 10
  epoch_freq: 1
  save_strategy: "step"
  project_dir: "outputs/crank/llm/lora/single_chip/llama_3_2_1b_custom"
  final_checkpoint_name: "final_model.pth"
  save_optim: False
  keep_last_n: 3
  keep_best_n: 3
  keep_all_checkpoints: False
  checkpoint_metric: "val/loss"
  checkpoint_metric_mode: "min"
  resume_from_checkpoint: False
  resume_option: "last"
  checkpoint_path: ""

# Reproducibility settings
seed: 23
deterministic: False

# Device settings - single chip (no mesh).
use_tt: True
