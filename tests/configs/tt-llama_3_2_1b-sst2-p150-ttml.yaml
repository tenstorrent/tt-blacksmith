# CI overrides for the ttml Llama 3.2 1B SST-2 recipe
# (blacksmith/tools/trainer/examples/ttml/llm/lora/single_chip/llama_3_2_1b_sst2.yaml):
# 32 steps of SST-2, validation every 8 steps on 32 batches of the validation split.
test_config:
  max_steps_per_epoch: 32
val_steps_freq: 8
metrics:
  steps_freq: 1
logging:
  use_wandb: false
checkpoint:
  save_strategy: "none"
  init_from_checkpoint: false
